name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ "Ruri" ]

jobs:
  build:
    name: Build with Xcode 27
    runs-on: xcode-27

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Confirm Xcode Version
        run: |
          xcodebuild -version

      - name: Build and Archive
        run: |
          mkdir -p build

          
          xcodebuild -project LiveSimBooter.xcodeproj \
            -scheme LiveSimBooter \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath Build/DerivedData \
            archive -archivePath Build/LiveSimBooter.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA from Archive
        run: |
          
          mkdir -p Build/Payload
          cp -r Build/DerivedData/Build/Products/Debug-iphoneos/*.app Build/Payload/ \
            || cp -r Build/LiveSimBooter.xcarchive/Products/Applications/*.app Build/Payload/

          
          cd Build && zip -r LiveSimBooter.zip Payload
          mv LiveSimBooter.zip ../LiveSimBooter.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSimBooter
          path: LiveSimBooter.ipa
